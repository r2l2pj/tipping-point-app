name: Deploy VPS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tipping-point-vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.VPS_APP_DEPLOY_ENABLED == '1' &&
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' ||
       github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Deploy reviewed main revision
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Configure VPS_HOST}"
          : "${VPS_USER:?Configure VPS_USER}"
          : "${VPS_DEPLOY_KEY:?Configure VPS_DEPLOY_KEY}"
          : "${VPS_KNOWN_HOSTS:?Configure VPS_KNOWN_HOSTS}"
          VPS_SSH_PORT="${VPS_SSH_PORT:-22}"
          [[ "$VPS_SSH_PORT" =~ ^[0-9]{1,5}$ ]] && ((VPS_SSH_PORT > 0 && VPS_SSH_PORT < 65536))
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$VPS_HOST" =~ ^([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)(\.([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?))*$ ]]

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_DEPLOY_KEY" > "$HOME/.ssh/tipping-point-deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/tipping-point-deploy" "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/tipping-point-deploy" -p "$VPS_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$VPS_USER@$VPS_HOST" \
            "sudo -n /usr/local/sbin/tipping-point-app-deploy $RELEASE_SHA"
